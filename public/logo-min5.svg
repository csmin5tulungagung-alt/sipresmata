<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="greenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer Golden Shield / Lima Sudut Lengkung -->
  <path d="M 250,15 
           C 295,75 425,145 470,175 
           C 420,285 410,400 250,480 
           C 90,400 80,285 30,175 
           C 75,145 205,75 250,15 Z" 
        fill="url(#goldGrad)" stroke="#000000" stroke-width="6" stroke-linejoin="round" filter="url(#dropShadow)"/>

  <!-- Inner Black Border -->
  <path d="M 250,30 
           C 290,85 410,150 450,180 
           C 405,275 395,385 250,460 
           C 105,385 95,275 50,180 
           C 90,150 210,85 250,30 Z" 
        fill="#000000"/>

  <!-- 2. Green Inner Shield Body -->
  <path d="M 250,38 
           C 288,90 402,154 440,182 
           C 396,272 386,378 250,450 
           C 114,378 104,272 60,182 
           C 98,154 212,90 250,38 Z" 
        fill="url(#greenBg)"/>

  <!-- 3. Bintang Emas Sudut Lima di Atas -->
  <!-- Center top (250, 95) -->
  <polygon points="250,55 261,85 293,86 268,105 277,135 250,118 223,135 232,105 207,86 239,85" 
           fill="url(#goldGrad)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>

  <!-- 4. Obor & Api Menyala -->
  <!-- Kobaran Api -->
  <path d="M 250,120 
           C 265,145 285,160 270,195 
           C 290,175 295,200 275,230 
           C 255,220 252,205 250,185 
           C 248,205 245,220 225,230 
           C 205,200 210,175 230,195 
           C 215,160 235,145 250,120 Z" 
        fill="url(#flameGrad)" stroke="#000000" stroke-width="3"/>

  <!-- Dudukan Obor / Bunga Teratai -->
  <path d="M 220,230 Q 250,215 280,230 L 275,242 Q 250,236 225,242 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <path d="M 225,242 L 275,242 L 265,270 L 235,270 Z" fill="#22c55e" stroke="#000000" stroke-width="3"/>
  <!-- Tangkai Obor Bawah -->
  <rect x="241" y="270" width="18" height="150" fill="#22c55e" stroke="#000000" stroke-width="3" rx="4"/>
  <line x1="241" y1="365" x2="259" y2="365" stroke="#000000" stroke-width="3"/>
  <line x1="241" y1="385" x2="259" y2="385" stroke="#000000" stroke-width="3"/>

  <!-- 5. Kapas (Sebelah Kiri) -->
  <g id="kapas-branch" stroke="#000000" stroke-width="3">
    <!-- Batang Lengkung -->
    <path d="M 125,370 C 105,280 110,180 200,120" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Kuntum Kapas (Putih & Kelopak Hitam) -->
    <!-- 1 -->
    <circle cx="190" cy="130" r="11" fill="#ffffff"/>
    <path d="M 183,137 C 187,143 197,143 200,137 Z" fill="#000000"/>
    <!-- 2 -->
    <circle cx="168" cy="148" r="11" fill="#ffffff"/>
    <path d="M 160,154 C 165,161 175,161 178,154 Z" fill="#000000"/>
    <!-- 3 -->
    <circle cx="150" cy="172" r="12" fill="#ffffff"/>
    <path d="M 141,178 C 146,186 157,186 160,178 Z" fill="#000000"/>
    <!-- 4 -->
    <circle cx="135" cy="200" r="12" fill="#ffffff"/>
    <path d="M 125,206 C 130,214 142,214 145,206 Z" fill="#000000"/>
    <!-- 5 -->
    <circle cx="123" cy="230" r="13" fill="#ffffff"/>
    <path d="M 112,236 C 117,245 130,245 134,236 Z" fill="#000000"/>
    <!-- 6 -->
    <circle cx="116" cy="265" r="13" fill="#ffffff"/>
    <path d="M 105,271 C 110,280 123,280 127,271 Z" fill="#000000"/>
    <!-- 7 -->
    <circle cx="112" cy="300" r="13" fill="#ffffff"/>
    <path d="M 101,306 C 106,315 119,315 123,306 Z" fill="#000000"/>
    <!-- 8 -->
    <circle cx="115" cy="335" r="13" fill="#ffffff"/>
    <path d="M 104,341 C 109,350 122,350 126,341 Z" fill="#000000"/>
  </g>

  <!-- 6. Padi Emas (Sebelah Kanan) -->
  <g id="padi-branch" fill="url(#goldGrad)" stroke="#000000" stroke-width="3">
    <!-- Batang Padi -->
    <path d="M 375,370 C 395,280 390,180 300,120" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Butir Padi Emas -->
    <ellipse cx="308" cy="128" rx="14" ry="7" transform="rotate(-30 308 128)"/>
    <ellipse cx="330" cy="142" rx="15" ry="8" transform="rotate(-20 330 142)"/>
    <ellipse cx="350" cy="162" rx="16" ry="8" transform="rotate(-10 350 162)"/>
    <ellipse cx="368" cy="188" rx="17" ry="8" transform="rotate(5 368 188)"/>
    <ellipse cx="380" cy="216" rx="17" ry="8" transform="rotate(18 380 216)"/>
    <ellipse cx="388" cy="248" rx="17" ry="9" transform="rotate(30 388 248)"/>
    <ellipse cx="390" cy="280" rx="17" ry="9" transform="rotate(45 390 280)"/>
    <ellipse cx="385" cy="312" rx="17" ry="9" transform="rotate(60 385 312)"/>
    <ellipse cx="375" cy="342" rx="17" ry="9" transform="rotate(75 375 342)"/>
    <ellipse cx="358" cy="368" rx="16" ry="8" transform="rotate(90 358 368)"/>
  </g>

  <!-- 7. Kitab Suci Al-Qur'an Terbuka & Rehal -->
  <!-- Rehal / Tatakan Hitam -->
  <polygon points="170,345 250,305 330,345 315,365 250,335 185,365" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Lembaran Kitab Kuning Terbuka -->
  <!-- Halaman Kiri -->
  <path d="M 250,305 
           C 215,240 180,240 170,265 
           L 185,335 
           C 195,315 225,315 250,305 Z" 
        fill="#fef08a" stroke="#000000" stroke-width="4"/>
  <path d="M 185,280 C 205,268 230,270 245,285" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 190,300 C 210,288 235,290 245,302" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 195,320 C 212,308 235,310 245,318" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Halaman Kanan -->
  <path d="M 250,305 
           C 285,240 320,240 330,265 
           L 315,335 
           C 305,315 275,315 250,305 Z" 
        fill="#facc15" stroke="#000000" stroke-width="4"/>
  <path d="M 315,280 C 295,268 270,270 255,285" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 310,300 C 290,288 265,290 255,302" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 305,320 C 288,308 265,310 255,318" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- 8. Pita Putih Bawah (MIN 5 TULUNGAGUNG) -->
  <!-- Sayap Kiri Pita -->
  <polygon points="120,400 160,375 160,425 110,435" fill="#e2e8f0" stroke="#000000" stroke-width="3"/>
  <polygon points="110,435 120,400 95,415" fill="#94a3b8" stroke="#000000" stroke-width="3"/>

  <!-- Sayap Kanan Pita -->
  <polygon points="380,400 340,375 340,425 390,435" fill="#e2e8f0" stroke="#000000" stroke-width="3"/>
  <polygon points="390,435 380,400 405,415" fill="#94a3b8" stroke="#000000" stroke-width="3"/>

  <!-- Badan Tengah Pita Lengkung -->
  <path d="M 140,390 
           Q 250,450 360,390 
           L 350,435 
           Q 250,490 150,435 Z" 
        fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Teks Lengkung Pada Pita: MIN 5 TULUNGAGUNG -->
  <path id="textPathRibbon" d="M 155,425 Q 250,470 345,425" fill="none"/>
  <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="23" fill="#000000">
    <textPath href="#textPathRibbon" startOffset="50%" text-anchor="middle">
      MIN 5 TULUNGAGUNG
    </textPath>
  </text>
</svg>
